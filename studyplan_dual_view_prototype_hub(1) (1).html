<!DOCTYPE html>
<html lang="id" class="h-full">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>StudyPlan - Pengatur Tugas & Jadwal Mahasiswa (Prototype Hub)</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <!-- Google Fonts: Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            babyblue: {
              DEFAULT: '#89CFF0',
              dark: '#3A9BD5',
              darker: '#1E6898',
              light: '#E8F6FD',
              soft: '#F5F9FC',
            },
            diff: {
              easyBg: '#E6F4EA', easyText: '#137333',
              medBg: '#FEF7E0', medText: '#B06000',
              hardBg: '#FCE8E6', hardText: '#C5221F',
            }
          },
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
          }
        }
      }
    }
  </script>

  <style>
    /* Custom Scrollbar */
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #CBD5E1; border-radius: 9999px; }
    .dark ::-webkit-scrollbar-thumb { background: #334155; }
    
    /* Device Frames & Shadows */
    .laptop-frame {
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25), 0 0 0 12px #1e293b;
      border-radius: 20px;
    }
    .hp-frame {
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.3), 0 0 0 10px #0f172a;
      border-radius: 36px;
    }
    .hp-notch {
      width: 120px;
      height: 24px;
      background: #0f172a;
      border-bottom-left-radius: 14px;
      border-bottom-right-radius: 14px;
    }
    
    /* Hide scrollbars for slick horizontal scroll */
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
  </style>
</head>
<body id="appBody" class="bg-slate-100 dark:bg-slate-900 text-slate-800 dark:text-slate-100 font-sans h-full flex flex-col overflow-hidden transition-colors duration-300">

  <!-- ==========================================
       TOP CONTROL TOOLBAR (PRESENTATION HUB)
       ========================================== -->
  <header id="topBar" class="bg-white dark:bg-[#152331] border-b border-slate-200 dark:border-slate-800 px-4 py-3 flex-shrink-0 z-30 shadow-sm transition-colors duration-300">
    <div class="max-w-7xl mx-auto flex flex-wrap items-center justify-between gap-3">
      
      <!-- Logo & Title -->
      <div class="flex items-center gap-3">
        <div class="w-9 h-9 rounded-xl bg-babyblue flex items-center justify-center text-babyblue-dark shadow-sm">
          <i data-lucide="calendar-check" class="w-5 h-5 stroke-[2.5]"></i>
        </div>
        <div>
          <h1 class="font-bold text-base leading-tight flex items-center gap-2 text-slate-900 dark:text-white">
            StudyPlan 
            <span class="text-xs bg-babyblue-light text-babyblue-dark dark:bg-slate-800 dark:text-babyblue font-semibold px-2 py-0.5 rounded-full border border-babyblue/30">
              Prototype Hub
            </span>
          </h1>
          <p class="text-xs text-slate-500 dark:text-slate-400">Pengatur Tugas & Jadwal Mahasiswa</p>
        </div>
      </div>

      <!-- Center Controls: View Modes & Screen Selector -->
      <div class="flex items-center gap-2 flex-wrap">
        
        <!-- View Mode Switcher -->
        <div class="bg-slate-100 dark:bg-slate-800 p-1 rounded-xl flex items-center text-xs font-medium border border-slate-200 dark:border-slate-700">
          <button id="btnViewBoth" onclick="setViewMode('both')" class="px-3 py-1.5 rounded-lg transition flex items-center gap-1.5 bg-white dark:bg-slate-700 shadow-sm text-babyblue-dark dark:text-babyblue font-semibold">
            <i data-lucide="columns" class="w-3.5 h-3.5"></i>
            <span class="hidden sm:inline">Mode</span> Bandingkan
          </button>
          <button id="btnViewLaptop" onclick="setViewMode('laptop')" class="px-3 py-1.5 rounded-lg transition flex items-center gap-1.5 text-slate-600 dark:text-slate-300 hover:text-slate-900 dark:hover:text-white">
            <i data-lucide="laptop" class="w-3.5 h-3.5"></i>
            Laptop <span class="text-[10px] opacity-75">(1440px)</span>
          </button>
          <button id="btnViewHP" onclick="setViewMode('hp')" class="px-3 py-1.5 rounded-lg transition flex items-center gap-1.5 text-slate-600 dark:text-slate-300 hover:text-slate-900 dark:hover:text-white">
            <i data-lucide="smartphone" class="w-3.5 h-3.5"></i>
            HP <span class="text-[10px] opacity-75">(390px)</span>
          </button>
        </div>

        <!-- Screen Selector Dropdown -->
        <div class="flex items-center gap-2">
          <span class="text-xs text-slate-500 dark:text-slate-400 hidden md:inline">Layar:</span>
          <select id="screenSelect" onchange="switchScreen(this.value)" class="bg-slate-100 dark:bg-slate-800 text-slate-800 dark:text-slate-100 text-xs font-semibold rounded-xl px-3 py-2 border-0 outline-none ring-1 ring-slate-200 dark:ring-slate-700 focus:ring-2 focus:ring-babyblue cursor-pointer">
            <option value="beranda">1. Beranda</option>
            <option value="matakuliah">2. Mata Kuliah</option>
            <option value="tugas">3. Daftar Tugas</option>
            <option value="tambah_tugas">4. Tambah / Ubah Tugas</option>
            <option value="jadwal">5. Jadwal</option>
            <option value="pengingat">6. Pengingat</option>
            <option value="pengaturan">7. Pengaturan / Lainnya</option>
          </select>
        </div>

      </div>

      <!-- Right Controls: Utilities & Dark Mode -->
      <div class="flex items-center gap-2">
        
        <!-- Zoom Controls -->
        <div class="hidden xl:flex items-center bg-slate-100 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-xl px-2 py-1 text-xs text-slate-700 dark:text-slate-300">
          <button onclick="adjustZoom(-0.05)" class="p-1 hover:text-babyblue-dark dark:hover:text-babyblue" title="Zoom Out"><i data-lucide="zoom-out" class="w-3.5 h-3.5"></i></button>
          <span id="zoomVal" class="px-1.5 font-mono text-[11px]">85%</span>
          <button onclick="adjustZoom(0.05)" class="p-1 hover:text-babyblue-dark dark:hover:text-babyblue" title="Zoom In"><i data-lucide="zoom-in" class="w-3.5 h-3.5"></i></button>
        </div>

        <!-- Data Reset/Seed Demo -->
        <button onclick="resetDemoData()" class="p-2 text-slate-500 hover:text-slate-700 dark:hover:text-slate-200 rounded-xl hover:bg-slate-100 dark:hover:bg-slate-800 transition" title="Reset Data Demo">
          <i data-lucide="rotate-ccw" class="w-4 h-4"></i>
        </button>

        <!-- Global Dark Mode Toggle -->
        <button onclick="toggleDarkMode()" class="p-2 text-slate-600 dark:text-amber-400 hover:text-amber-500 rounded-xl hover:bg-slate-100 dark:hover:bg-slate-800 transition" title="Toggle Mode Gelap / Terang">
          <i data-lucide="moon" class="w-4 h-4 hidden dark:block"></i>
          <i data-lucide="sun" class="w-4 h-4 block dark:hidden"></i>
        </button>
      </div>

    </div>
  </header>

  <!-- Notification Toast Container -->
  <div id="toastContainer" class="fixed top-16 right-5 z-50 flex flex-col gap-2 pointer-events-none"></div>

  <!-- Global Modal Container -->
  <div id="globalModal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
    <div id="modalContent" class="bg-white dark:bg-[#152331] rounded-2xl max-w-md w-full p-6 shadow-2xl transform transition-all border border-slate-100 dark:border-slate-800">
      <!-- Injected via JS -->
    </div>
  </div>

  <!-- ==========================================
       MAIN WORKSPACE / DUAL DEVICE CONTAINER
       ========================================== -->
  <main id="mainCanvas" class="flex-1 bg-slate-200/70 dark:bg-[#0A121A] overflow-auto p-4 md:p-8 flex items-center justify-center relative transition-colors duration-300">
    
    <div id="viewportScaler" class="transition-all duration-300 transform origin-top flex flex-col xl:flex-row items-center xl:items-start justify-center gap-8 max-w-full">
      
      <!-- --------------------------------------
           1. LAPTOP MOCKUP FRAME (1440px target)
           -------------------------------------- -->
      <div id="laptopContainer" class="laptop-frame bg-slate-900 w-[1280px] max-w-full h-[760px] flex flex-col overflow-hidden transition-all duration-300 border border-slate-700/50">
        
        <!-- Laptop Window Header / Titlebar -->
        <div class="bg-slate-800 dark:bg-slate-950 border-b border-slate-700/60 px-4 py-2.5 flex items-center justify-between text-slate-400 text-xs shrink-0">
          <div class="flex items-center gap-2">
            <span class="w-3 h-3 rounded-full bg-rose-500 inline-block"></span>
            <span class="w-3 h-3 rounded-full bg-amber-500 inline-block"></span>
            <span class="w-3 h-3 rounded-full bg-emerald-500 inline-block"></span>
            <span class="ml-2 font-mono text-[11px] text-slate-400 flex items-center gap-1">
              <i data-lucide="lock" class="w-3 h-3 text-emerald-400"></i> https://studyplan.app/student
            </span>
          </div>
          <div class="flex items-center gap-3 font-medium">
            <span class="bg-slate-700 dark:bg-slate-800 text-slate-300 px-2.5 py-0.5 rounded text-[10px]">LAPTOP VIEW (1440px)</span>
          </div>
        </div>

        <!-- Laptop View Screen Inner App Container -->
        <div id="laptopAppRoot" class="flex-1 bg-[#F5F9FC] dark:bg-[#0F1A24] text-[#1F2A37] dark:text-[#F8FAFC] flex overflow-hidden relative transition-colors duration-300">
          <!-- Dynamically Rendered Laptop Layout -->
        </div>

      </div>

      <!-- --------------------------------------
           2. MOBILE HP MOCKUP FRAME (390px target)
           -------------------------------------- -->
      <div id="hpContainer" class="hp-frame bg-slate-950 w-[390px] h-[760px] flex flex-col relative overflow-hidden transition-all duration-300 shrink-0 border border-slate-800">
        
        <!-- HP Top Notch / Island -->
        <div class="absolute top-0 left-1/2 -translate-x-1/2 z-40 hp-notch flex items-end justify-center pb-1">
          <div class="w-12 h-1 bg-slate-800 rounded-full"></div>
        </div>

        <!-- HP Status Bar -->
        <div id="hpStatusBar" class="pt-2 px-6 pb-1 flex justify-between items-center text-[11px] font-semibold text-slate-600 dark:text-slate-400 bg-white dark:bg-[#152331] border-b border-slate-100 dark:border-slate-800/80 z-30 transition-colors duration-300">
          <span>09:41</span>
          <div class="flex items-center gap-1.5">
            <i data-lucide="wifi" class="w-3 h-3"></i>
            <i data-lucide="battery-charging" class="w-3.5 h-3.5"></i>
          </div>
        </div>

        <!-- HP Screen Inner App Container -->
        <div id="hpAppRoot" class="flex-1 bg-[#F5F9FC] dark:bg-[#0F1A24] text-[#1F2A37] dark:text-[#F8FAFC] flex flex-col overflow-hidden relative transition-colors duration-300">
          <!-- Dynamically Rendered HP Layout -->
        </div>

      </div>

    </div>

  </main>

  <!-- ==========================================
       SYSTEM STATE & APPLICATION LOGIC (JS)
       ========================================== -->
  <script>
    // ----------------------------------------------------
    // INITIAL SYSTEM STATE & LOCALSTORAGE DATA MANAGEMENT
    // Implementation of PenyimpananJSON (matakuliah, tugas, jadwal, pengingat)
    // ----------------------------------------------------
    const STORAGE_KEY = 'studyplan_data_v2';
    
    // Default Preset Data
    const DEFAULT_DATA = {
      courses: [
        { id: 'M01', name: 'Algoritma & Pemrograman' },
        { id: 'M02', name: 'Basis Data Lanjut' },
        { id: 'M03', name: 'Interaksi Manusia & Komputer' },
        { id: 'M04', name: 'Matematika Diskrit' },
        { id: 'M05', name: 'Jaringan Komputer' }
      ],
      tasks: [
        {
          id: 'T001',
          courseId: 'M02',
          title: 'Tugas Linked List & SQL',
          source: 'e-learning',
          deadline: getRelativeDateTime(1, 23, 59),
          difficulty: 3,
          status: 'belum'
        },
        {
          id: 'T002',
          courseId: 'M03',
          title: 'Paper UX Research Prototype',
          source: 'Google Classroom',
          deadline: getRelativeDateTime(3, 17, 0),
          difficulty: 2,
          status: 'belum'
        },
        {
          id: 'T003',
          courseId: 'M04',
          title: 'Kuis Singkat Teori Graf',
          source: 'VLM Kampus',
          deadline: getRelativeDateTime(0, 20, 0),
          difficulty: 1,
          status: 'belum'
        }
      ],
      schedules: [
        {
          id: 'J001',
          courseId: 'M02',
          title: 'Kuliah Basis Data Lanjut',
          date: getRelativeDateOnly(0),
          startTime: '08:00',
          endTime: '10:30'
        },
        {
          id: 'J002',
          courseId: 'M05',
          title: 'Praktikum Jaringan Komputer',
          date: getRelativeDateOnly(0),
          startTime: '13:00',
          endTime: '15:30'
        },
        {
          id: 'J003',
          courseId: 'M03',
          title: 'Kuliah IMK Prototype Review',
          date: getRelativeDateOnly(2),
          startTime: '10:00',
          endTime: '12:30'
        }
      ],
      reminders: []
    };

    let appData = loadAppData();
    let currentScreen = 'beranda';
    let viewMode = 'both';
    let currentZoom = 0.85;
    let isGlobalDarkMode = false;
    let scheduleTab = 'minggu'; // Tab aktif Jadwal: 'hari' atau 'minggu'

    function getRelativeDateTime(daysOffset, hours = 23, mins = 59) {
      const d = new Date();
      d.setDate(d.getDate() + daysOffset);
      d.setHours(hours, mins, 0, 0);
      return d.toISOString().slice(0, 16);
    }

    function getRelativeDateOnly(daysOffset) {
      const d = new Date();
      d.setDate(d.getDate() + daysOffset);
      return d.toISOString().split('T')[0];
    }

    function loadAppData() {
      const stored = localStorage.getItem(STORAGE_KEY);
      let data = stored ? JSON.parse(stored) : JSON.parse(JSON.stringify(DEFAULT_DATA));
      data = runAutoCleanup(data); // PembersihOtomatis.jalankan_saat_aplikasi_dibuka()
      saveAppData(data);
      return data;
    }

    function saveAppData(data) {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
    }

    // ----------------------------------------------------
    // PembersihOtomatis & AntrianPrioritas Min-Heap Implementation
    // ----------------------------------------------------
    function runAutoCleanup(data) {
      const now = new Date();

      // hapus_tugas_lewat_tenggat()
      data.tasks = data.tasks.filter(t => {
        const d = new Date(t.deadline);
        return d >= now || t.status === 'selesai';
      });

      // hapus_jadwal_lewat()
      data.schedules = data.schedules.filter(s => {
        const schDate = new Date(`${s.date}T${s.endTime || '23:59'}`);
        return schDate >= now;
      });

      // AntrianPengingat (Min-Heap update H-2)
      data.reminders = [];
      data.tasks.forEach(task => {
        if (task.status === 'belum') {
          const deadlineDate = new Date(task.deadline);
          let reminderTime = new Date(deadlineDate.getTime() - (2 * 24 * 60 * 60 * 1000));
          
          let note = "Pengingat otomatis H-2 sebelum tenggat";
          if (reminderTime < now) {
            reminderTime = new Date(now.getTime() + 60000);
            note = "Pengingat aktif (H-2 sudah lewat)";
          }

          data.reminders.push({
            id: `R-${task.id}`,
            taskId: task.id,
            title: task.title,
            courseId: task.courseId,
            time: reminderTime.toISOString().slice(0, 16),
            deadline: task.deadline,
            note: note
          });
        }
      });

      // Sort AntrianPengingat oleh waktu_pengingat terdekat
      data.reminders.sort((a, b) => new Date(a.time) - new Date(b.time));

      return data;
    }

    // AntrianPrioritas (Min-Heap) -> Urutan: Tenggat terdekat, lalu Kesulitan tertinggi (3 > 2 > 1)
    function getSortedTasks(taskList) {
      return [...taskList].sort((a, b) => {
        const dA = new Date(a.deadline);
        const dB = new Date(b.deadline);
        if (dA.getTime() !== dB.getTime()) {
          return dA - dB;
        }
        return b.difficulty - a.difficulty;
      });
    }

    function switchScreen(screenName) {
      currentScreen = screenName;
      document.getElementById('screenSelect').value = screenName;
      renderAllViews();
    }

    function setViewMode(mode) {
      viewMode = mode;
      const laptopC = document.getElementById('laptopContainer');
      const hpC = document.getElementById('hpContainer');
      const btnBoth = document.getElementById('btnViewBoth');
      const btnLaptop = document.getElementById('btnViewLaptop');
      const btnHP = document.getElementById('btnViewHP');

      [btnBoth, btnLaptop, btnHP].forEach(btn => {
        btn.className = "px-3 py-1.5 rounded-lg transition flex items-center gap-1.5 text-slate-600 dark:text-slate-300 hover:text-slate-900 dark:hover:text-white";
      });

      if (mode === 'both') {
        laptopC.classList.remove('hidden');
        hpC.classList.remove('hidden');
        btnBoth.className = "px-3 py-1.5 rounded-lg transition flex items-center gap-1.5 bg-white dark:bg-slate-700 shadow-sm text-babyblue-dark dark:text-babyblue font-semibold";
      } else if (mode === 'laptop') {
        laptopC.classList.remove('hidden');
        hpC.classList.add('hidden');
        btnLaptop.className = "px-3 py-1.5 rounded-lg transition flex items-center gap-1.5 bg-white dark:bg-slate-700 shadow-sm text-babyblue-dark dark:text-babyblue font-semibold";
      } else if (mode === 'hp') {
        laptopC.classList.add('hidden');
        hpC.classList.remove('hidden');
        btnHP.className = "px-3 py-1.5 rounded-lg transition flex items-center gap-1.5 bg-white dark:bg-slate-700 shadow-sm text-babyblue-dark dark:text-babyblue font-semibold";
      }
    }

    function adjustZoom(delta) {
      currentZoom = Math.min(Math.max(0.5, currentZoom + delta), 1.2);
      document.getElementById('zoomVal').innerText = `${Math.round(currentZoom * 100)}%`;
      document.getElementById('viewportScaler').style.transform = `scale(${currentZoom})`;
    }

    function toggleDarkMode() {
      isGlobalDarkMode = !isGlobalDarkMode;
      
      const htmlEl = document.documentElement;
      if (isGlobalDarkMode) {
        htmlEl.classList.add('dark');
      } else {
        htmlEl.classList.remove('dark');
      }

      renderAllViews();
    }

    function showToast(message, type = 'info') {
      const container = document.getElementById('toastContainer');
      const toast = document.createElement('div');
      toast.className = `px-4 py-3 rounded-xl shadow-xl text-xs font-semibold flex items-center gap-2.5 transition-all transform translate-y-2 bg-slate-900 text-white border border-slate-700 pointer-events-auto max-w-sm`;
      
      const icon = type === 'success' ? 'check-circle' : 'info';
      toast.innerHTML = `<i data-lucide="${icon}" class="w-4 h-4 text-babyblue shrink-0"></i> <span>${message}</span>`;
      
      container.appendChild(toast);
      lucide.createIcons();

      setTimeout(() => {
        toast.classList.add('opacity-0', 'translate-y-[-10px]');
        setTimeout(() => toast.remove(), 300);
      }, 3500);
    }

    function resetDemoData() {
      appData = JSON.parse(JSON.stringify(DEFAULT_DATA));
      appData = runAutoCleanup(appData);
      saveAppData(appData);
      renderAllViews();
      showToast('Data demo berhasil di-reset ke kondisi awal.', 'success');
    }

    // CRUD ACTIONS (Sesuai Diagram Kelas UML)
    function addOrUpdateCourse(id, name) {
      if (!name || !name.trim()) return;
      if (id) {
        const c = appData.courses.find(x => x.id === id);
        if (c) c.name = name;
      } else {
        const newId = `M0${appData.courses.length + 1}`;
        appData.courses.push({ id: newId, name: name });
      }
      appData = runAutoCleanup(appData);
      saveAppData(appData);
      renderAllViews();
      showToast('Mata kuliah berhasil disimpan.', 'success');
    }

    function deleteCourse(id) {
      openModal('Hapus Mata Kuliah?', 'Semua tugas dan jadwal yang berhubungan dengan mata kuliah ini akan terpengaruh.', () => {
        appData.courses = appData.courses.filter(c => c.id !== id);
        appData = runAutoCleanup(appData);
        saveAppData(appData);
        renderAllViews();
        showToast('Mata kuliah dihapus.', 'info');
      });
    }

    function addOrUpdateTask(taskData) {
      const isEdit = !!taskData.id;
      if (isEdit) {
        const idx = appData.tasks.findIndex(t => t.id === taskData.id);
        if (idx !== -1) appData.tasks[idx] = taskData;
      } else {
        taskData.id = `T0${appData.tasks.length + 10}`;
        appData.tasks.push(taskData);
      }

      appData = runAutoCleanup(appData);
      saveAppData(appData);
      renderAllViews();
      showToast('Tugas berhasil disimpan. Pengingat H-2 dibuat otomatis.', 'success');
      switchScreen('tugas');
    }

    function toggleTaskStatus(taskId) {
      const task = appData.tasks.find(t => t.id === taskId);
      if (task) {
        task.status = task.status === 'selesai' ? 'belum' : 'selesai';
        appData = runAutoCleanup(appData);
        saveAppData(appData);
        renderAllViews();
        showToast(task.status === 'selesai' ? 'Tugas ditandai selesai!' : 'Tugas diubah menjadi belum selesai.', 'success');
      }
    }

    function deleteTask(taskId) {
      openModal('Hapus Tugas?', 'Tugas beserta pengingat otomatisnya akan dihapus permanen.', () => {
        appData.tasks = appData.tasks.filter(t => t.id !== taskId);
        appData = runAutoCleanup(appData);
        saveAppData(appData);
        renderAllViews();
        showToast('Tugas & pengingat berhasil dihapus.', 'info');
      });
    }

    function addOrUpdateSchedule(schData) {
      if (schData.id) {
        const idx = appData.schedules.findIndex(s => s.id === schData.id);
        if (idx !== -1) appData.schedules[idx] = schData;
      } else {
        schData.id = `J0${appData.schedules.length + 10}`;
        appData.schedules.push(schData);
      }
      appData = runAutoCleanup(appData);
      saveAppData(appData);
      renderAllViews();
      showToast('Jadwal kuliah berhasil disimpan.', 'success');
      switchScreen('jadwal');
    }

    function deleteSchedule(schId) {
      openModal('Hapus Jadwal?', 'Jadwal kuliah ini akan dihapus dari agenda.', () => {
        appData.schedules = appData.schedules.filter(s => s.id !== schId);
        appData = runAutoCleanup(appData);
        saveAppData(appData);
        renderAllViews();
        showToast('Jadwal dihapus.', 'info');
      });
    }

    function handleReminderFormSubmit(e, reminderId) {
      e.preventDefault();
      const timeVal = document.getElementById('reminderTimeInput').value;
      if (reminderId) {
        // Edit Pengingat
        const r = appData.reminders.find(item => item.id === reminderId);
        if (r) {
          r.time = timeVal;
          r.note = "Pengingat disunting manual oleh pengguna";
        }
      } else {
        // Tambah Pengingat Baru
        const taskId = document.getElementById('reminderTaskSelect').value;
        const task = appData.tasks.find(t => t.id === taskId);
        if (task) {
          appData.reminders.push({
            id: `R-CUSTOM-${Date.now()}`,
            taskId: task.id,
            title: task.title,
            courseId: task.courseId,
            time: timeVal,
            deadline: task.deadline,
            note: "Pengingat kustom pengguna"
          });
        }
      }
      appData.reminders.sort((a, b) => new Date(a.time) - new Date(b.time));
      saveAppData(appData);
      renderAllViews();
      closeModal();
      showToast('Pengingat berhasil diperbarui.', 'success');
    }

    function deleteReminder(reminderId) {
      openModal('Hapus Pengingat?', 'Pengingat ini akan dihapus secara manual.', () => {
        appData.reminders = appData.reminders.filter(r => r.id !== reminderId);
        saveAppData(appData);
        renderAllViews();
        showToast('Pengingat dihapus.', 'info');
      });
    }

    function getCourseName(courseId) {
      const c = appData.courses.find(x => x.id === courseId);
      return c ? c.name : 'Umum / Non-MK';
    }

    function formatDateTime(dtStr) {
      if (!dtStr) return '-';
      const d = new Date(dtStr);
      return d.toLocaleString('id-ID', { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' });
    }

    function formatDateOnly(dStr) {
      if (!dStr) return '-';
      const d = new Date(dStr);
      return d.toLocaleDateString('id-ID', { weekday: 'short', day: 'numeric', month: 'short' });
    }

    function getDifficultyBadgeHtml(level) {
      if (level == 1) return `<span class="px-2 py-0.5 rounded-full text-[10px] font-semibold bg-[#E6F4EA] text-[#137333] border border-emerald-200">Mudah (1)</span>`;
      if (level == 2) return `<span class="px-2 py-0.5 rounded-full text-[10px] font-semibold bg-[#FEF7E0] text-[#B06000] border border-amber-200">Sedang (2)</span>`;
      return `<span class="px-2 py-0.5 rounded-full text-[10px] font-semibold bg-[#FCE8E6] text-[#C5221F] border border-rose-200">Sulit (3)</span>`;
    }

    function getStatusBadgeHtml(status, deadlineStr) {
      if (status === 'selesai') return `<span class="px-2.5 py-0.5 rounded-full text-[10px] font-semibold bg-emerald-100 dark:bg-emerald-950/60 text-emerald-700 dark:text-emerald-300">Selesai</span>`;
      
      const deadline = new Date(deadlineStr);
      const now = new Date();
      const diffHours = (deadline - now) / (1000 * 60 * 60);

      if (diffHours <= 48 && diffHours >= 0) {
        return `<span class="px-2.5 py-0.5 rounded-full text-[10px] font-semibold bg-orange-100 text-orange-700 dark:bg-orange-950/60 dark:text-orange-300 animate-pulse">H-${Math.ceil(diffHours/24)} Tenggat!</span>`;
      }
      return `<span class="px-2.5 py-0.5 rounded-full text-[10px] font-semibold bg-slate-200 dark:bg-slate-700 text-slate-700 dark:text-slate-300">Belum</span>`;
    }

          <button onclick="switchScreen('tambah_tugas')" class="absolute bottom-16 right-4 w-12 h-12 rounded-full bg-babyblue text-slate-900 shadow-xl flex items-center justify-center z-20 active:scale-95 transition">
            <i data-lucide="plus" class="w-6 h-6 stroke-[3]"></i>
          </button>

          ${renderHPNavItem('beranda', 'grid', 'Beranda', screen)}

    function renderHPNavItem(key, icon, label, currentScreen) {
      const isActive = currentScreen === key;
      const color = isActive ? 'text-babyblue-dark dark:text-babyblue font-bold' : 'text-slate-400 dark:text-slate-500 hover:text-slate-600';

      return `
        <button onclick="switchScreen('${key}')" class="flex flex-col items-center gap-0.5 ${color} transition">
          <i data-lucide="${icon}" class="w-4 h-4"></i>
          <span class="text-[10px]">${label}</span>
        </button>
      `;
    }

    function renderHPScreenBody(screen, sortedTasks, todaySchedules, todayDateStr) {
      switch (screen) {
        case 'beranda':
          return renderHPBeranda(sortedTasks, todaySchedules, todayDateStr);
        case 'matakuliah':
          return renderHPMataKuliah();
        case 'tugas':
          return renderHPDaftarTugas(sortedTasks);
        case 'tambah_tugas':
          return renderHPTambahTugas();
        case 'jadwal':
          return renderHPJadwal(todaySchedules);
        case 'pengingat':
          return renderHPPengingat();
        case 'pengaturan':
          return renderHPPengaturan();
        default:
          return renderHPBeranda(sortedTasks, todaySchedules, todayDateStr);
      }
    }

          <div class="flex items-center justify-between">
            <h2 class="font-bold text-sm text-slate-900 dark:text-white">Jadwal Kuliah</h2>
            <button onclick="openScheduleModal()" class="px-2.5 py-1 rounded-lg bg-babyblue hover:bg-babyblue-dark text-slate-900 font-semibold text-[11px]">+ Tambah</button>
          </div>

          <!-- Tab Selector HP (Identik dengan Laptop) -->
          <div class="bg-white dark:bg-[#152331] p-1 rounded-xl flex items-center text-xs font-semibold border border-slate-100 dark:border-slate-800">
            <button onclick="setScheduleTab('hari')" class="flex-1 py-1.5 rounded-lg text-center transition ${scheduleTab === 'hari' ? 'bg-babyblue-light dark:bg-slate-800 text-babyblue-dark dark:text-babyblue font-bold shadow-sm' : 'text-slate-500 dark:text-slate-400'}">Hari Ini</button>
            <button onclick="setScheduleTab('minggu')" class="flex-1 py-1.5 rounded-lg text-center transition ${scheduleTab === 'minggu' ? 'bg-babyblue-light dark:bg-slate-800 text-babyblue-dark dark:text-babyblue font-bold shadow-sm' : 'text-slate-500 dark:text-slate-400'}">Minggu Ini</button>
          </div>

          ${scheduleTab === 'hari' ? `
            <!-- Daftar Hari Ini HP -->
            <div class="space-y-2">
              ${todaySchedules.length === 0 ? `
                <p class="text-xs text-center py-8 text-slate-400">Tidak ada jadwal kuliah hari ini.</p>
              ` : todaySchedules.map(s => `
                <div class="p-3.5 rounded-xl bg-white dark:bg-[#152331] border border-slate-100 dark:border-slate-800 text-xs flex items-center justify-between shadow-sm">
                  <div>
                    <p class="font-bold text-slate-900 dark:text-white">${s.title}</p>
                    <p class="text-[10px] text-babyblue-dark dark:text-babyblue font-semibold mt-0.5">${s.startTime} - ${s.endTime} WITA</p>
                    <p class="text-[10px] text-slate-400">${getCourseName(s.courseId)}</p>
                  </div>
                  <div class="flex items-center gap-1">
                    <button onclick="openScheduleModal('${s.id}')" title="Ubah Jadwal" class="p-1.5 text-slate-500 hover:text-slate-700 dark:hover:text-slate-300"><i data-lucide="edit-3" class="w-3.5 h-3.5"></i></button>
                    <button onclick="deleteSchedule('${s.id}')" title="Hapus Jadwal" class="p-1.5 text-rose-500 hover:text-rose-700"><i data-lucide="trash-2" class="w-3.5 h-3.5"></i></button>
                  </div>
                </div>
              `).join('')}
            </div>
          ` : `
            <!-- Daftar Mingguan HP (Per Hari - Identik Data dengan Laptop) -->
            <div class="space-y-3">
              ${days.map((day, idx) => {
                const targetDate = getRelativeDateOnly(idx);
                const daySchedules = appData.schedules.filter(s => s.date === targetDate || (idx === 0 && appData.schedules.length > 0 && !appData.schedules.some(x => x.date === targetDate)));
                const activeSchedules = idx === 0 ? appData.schedules : daySchedules;

                return `
                  <div class="bg-white dark:bg-[#152331] rounded-xl p-3 border border-slate-100 dark:border-slate-800 space-y-2">
                    <p class="font-bold text-xs text-babyblue-dark dark:text-babyblue border-b border-slate-100 dark:border-slate-800 pb-1.5">${day}</p>
                    ${activeSchedules.length === 0 ? `
                      <p class="text-[10px] text-slate-400">Tidak ada jadwal</p>
                    ` : activeSchedules.map(s => `
                      <div class="p-2.5 rounded-lg bg-slate-50 dark:bg-[#0F1A24] border border-slate-100 dark:border-slate-800 text-xs flex items-center justify-between">
                        <div>
                          <p class="font-bold text-slate-800 dark:text-slate-100">${s.title}</p>
                          <p class="text-[10px] text-slate-400">${s.startTime} - ${s.endTime} • ${getCourseName(s.courseId)}</p>
                        </div>
                        <div class="flex items-center gap-1">
                          <button onclick="openScheduleModal('${s.id}')" title="Ubah Jadwal" class="p-1 text-slate-500 hover:text-slate-700 dark:hover:text-slate-300"><i data-lucide="edit-3" class="w-3.5 h-3.5"></i></button>
                          <button onclick="deleteSchedule('${s.id}')" title="Hapus Jadwal" class="p-1 text-rose-500 hover:text-rose-700"><i data-lucide="trash-2" class="w-3.5 h-3.5"></i></button>
                        </div>
                      </div>
                    `).join('')}
                  </div>
                `;
              }).join('')}
            </div>
          `}
        </div>
      `;
    }

    function renderHPPengingat() {
      return `
        <div class="space-y-3">
          <div class="flex items-center justify-between">
            <h2 class="font-bold text-sm text-slate-900 dark:text-white">Daftar Pengingat (CRUD)</h2>
            <button onclick="openReminderModal()" class="px-2.5 py-1 rounded-lg bg-babyblue hover:bg-babyblue-dark text-slate-900 font-semibold text-[11px]">+ Tambah</button>
          </div>
          <div class="space-y-2">
            ${appData.reminders.length === 0 ? `
              <p class="text-xs text-center py-8 text-slate-400">Belum ada pengingat aktif.</p>
            ` : appData.reminders.map(r => `
              <div class="p-3 rounded-xl bg-white dark:bg-[#152331] border border-slate-100 dark:border-slate-800 text-xs flex items-center justify-between shadow-sm">
                <div>
                  <p class="font-bold text-slate-900 dark:text-white">${r.title}</p>
                  <p class="text-[10px] text-slate-400">${formatDateTime(r.time)} • ${getCourseName(r.courseId)}</p>
                </div>
                <div class="flex items-center gap-1">
                  <button onclick="openReminderModal('${r.id}')" title="Ubah Pengingat" class="p-1 text-slate-500 hover:text-slate-700 dark:hover:text-slate-300"><i data-lucide="edit-3" class="w-3.5 h-3.5"></i></button>
                  <button onclick="deleteReminder('${r.id}')" title="Hapus Pengingat" class="p-1 text-rose-500 hover:text-rose-700"><i data-lucide="trash-2" class="w-3.5 h-3.5"></i></button>
                </div>
              </div>
            `).join('')}
          </div>
        </div>
      `;
    }

    function renderHPPengaturan() {
      return `
        <div class="space-y-3 text-xs">
          <h2 class="font-bold text-sm text-slate-900 dark:text-white">Pengaturan & Menu Lainnya</h2>
          
          <div class="p-4 rounded-xl bg-white dark:bg-[#152331] border border-slate-100 dark:border-slate-800 space-y-3 shadow-sm">
            <button onclick="switchScreen('matakuliah')" class="w-full flex items-center justify-between py-2 border-b border-slate-100 dark:border-slate-800 text-left font-semibold text-slate-900 dark:text-white">
              <span>Kelola Mata Kuliah</span>
              <i data-lucide="chevron-right" class="w-4 h-4 text-slate-400"></i>
            </button>
            <div class="flex items-center justify-between py-1">
              <div>
                <p class="font-semibold text-slate-900 dark:text-white">Mode Gelap (Dark Mode)</p>
                <p class="text-[10px] text-slate-400">Ubah tema latar ke warna gelap</p>
              </div>
              <button onclick="toggleDarkMode()" class="px-3 py-1.5 rounded-lg bg-babyblue-light dark:bg-slate-800 text-babyblue-dark dark:text-babyblue font-semibold text-[11px]">Toggle Mode</button>
            </div>
          </div>

          <button onclick="resetDemoData()" class="w-full p-3.5 rounded-xl bg-rose-50 dark:bg-rose-950/40 text-rose-600 dark:text-rose-300 border border-rose-100 dark:border-rose-900/50 text-left font-semibold shadow-sm flex items-center justify-between">
            <span>Reset Data Demo</span>
            <i data-lucide="rotate-ccw" class="w-4 h-4"></i>
          </button>
        </div>
      `;
    }

    // INITIAL LAUNCH
    window.onload = function() {
      renderAllViews();
    };
  </script>
</body>
</html>
